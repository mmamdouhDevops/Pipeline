# =============================================================================================
#  CD entry point (reusable). Consumers call it from .github/workflows/cd.yml.
#  Only release/X.Y.Z and hotfix/X.Y.Z branches are accepted.
#
#   build once (artifact + SBOM + checksum)
#     → [approval] test     → deploy (db backup, migrations, app) → smoke → DAST
#     → [approval] staging  → deploy → smoke                       (Alibaba Cloud)
#     → [approval] production → deploy → smoke → tag + GitHub Release + PRs to main/develop
# =============================================================================================
name: cd-component

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: pipeline.yml
      components:
        description: Comma-separated component names (empty = all)
        type: string
        default: ""
      build_runner:
        description: 'JSON labels for the build job; empty = vars.RUNNER_CI, else ubuntu-latest'
        type: string
        default: ""
      run_dast:
        type: boolean
        default: true
      skip_staging:
        description: Emergency only – requires vars.ALLOW_SKIP_STAGING == 'true'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # -------------------------------------------------------------------------------- plan + version
  plan:
    name: Plan release
    runs-on: ${{ fromJSON(inputs.build_runner != '' && inputs.build_runner || vars.RUNNER_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      semver: ${{ steps.plan.outputs.semver }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: mmamdouhDevops/pipeline-templates/actions/plan@v1
        with:
          config: ${{ inputs.config }}
          mode: cd
          components: ${{ inputs.components }}
      - name: Release info
        shell: bash
        run: |
          {
            echo "### 📦 ${{ steps.plan.outputs.channel }} ${{ steps.plan.outputs.version }}"
            echo "Branch \`${{ github.ref_name }}\` @ \`${GITHUB_SHA::7}\` – components: ${{ steps.plan.outputs.names }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------------- build once
  build:
    name: Build · ${{ matrix.name }}
    needs: plan
    runs-on: ${{ fromJSON(inputs.build_runner != '' && inputs.build_runner || vars.RUNNER_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write          # artifact attestation (optional)
      attestations: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: contains(matrix.toolchain, 'dotnet')
        with:
          dotnet-version: ${{ matrix.dotnet_version }}
      - uses: actions/setup-node@v4
        if: contains(matrix.toolchain, 'node')
        with:
          node-version: ${{ matrix.node_version }}
      - uses: actions/setup-python@v5
        if: contains(matrix.toolchain, 'python')
        with:
          python-version: ${{ matrix.python_version }}
      - name: Package
        id: pkg
        uses: mmamdouhDevops/pipeline-templates/actions/package@v1
        with:
          component: ${{ toJSON(matrix) }}
          version: ${{ needs.plan.outputs.version }}
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ${{ steps.pkg.outputs.staging-dir }}
          format: cyclonedx-json
          output-file: dist/${{ matrix.name }}-${{ needs.plan.outputs.version }}.sbom.cdx.json
          upload-artifact: false
      - name: Build provenance attestation
        if: vars.ATTEST_BUILDS == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.name }}-${{ needs.plan.outputs.version }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------------- TEST (our servers / my VM)
  test:
    name: Test
    needs: [plan, build]
    uses: mmamdouhDevops/pipeline-templates/.github/workflows/deploy-stage.yml@v1
    with:
      environment: test
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ needs.plan.outputs.channel }}
      matrix: ${{ needs.plan.outputs.matrix }}
      runner: ${{ vars.RUNNER_DEPLOY_TEST || '["self-hosted","linux","env-test"]' }}
      run_dast: ${{ inputs.run_dast }}
    secrets: inherit

  # -------------------------------------------------------------------------------- STAGING (Alibaba Cloud)
  staging:
    name: Staging
    needs: [plan, test]
    if: ${{ !(inputs.skip_staging && vars.ALLOW_SKIP_STAGING == 'true') }}
    uses: mmamdouhDevops/pipeline-templates/.github/workflows/deploy-stage.yml@v1
    with:
      environment: staging
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ needs.plan.outputs.channel }}
      matrix: ${{ needs.plan.outputs.matrix }}
      runner: ${{ vars.RUNNER_DEPLOY_STAGING || '["self-hosted","linux","env-staging"]' }}
      run_dast: false
    secrets: inherit

  # -------------------------------------------------------------------------------- PRODUCTION (Alibaba Cloud)
  production:
    name: Production
    needs: [plan, test, staging]
    if: |
      always() && needs.test.result == 'success' &&
      (needs.staging.result == 'success' || (needs.staging.result == 'skipped' && inputs.skip_staging && vars.ALLOW_SKIP_STAGING == 'true'))
    uses: mmamdouhDevops/pipeline-templates/.github/workflows/deploy-stage.yml@v1
    with:
      environment: production
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ needs.plan.outputs.channel }}
      matrix: ${{ needs.plan.outputs.matrix }}
      runner: ${{ vars.RUNNER_DEPLOY_PRODUCTION || '["self-hosted","linux","env-production"]' }}
      run_dast: false
    secrets: inherit

  # -------------------------------------------------------------------------------- release bookkeeping
  release:
    name: Tag, GitHub Release, merge-back PRs
    needs: [plan, production]
    if: always() && needs.production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Tag + GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.semver }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists – keeping it"
          else
            git tag -a "$TAG" -m "$CHANNEL $VERSION deployed to production"
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes \
              --notes "Build \`$VERSION\` ($CHANNEL) – deployed to production by run ${{ github.run_id }}."
      - name: Open PRs → main and → develop (Git Flow back-merge)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          TAG: v${{ needs.plan.outputs.semver }}
        run: |
          for target in main develop; do
            if gh pr list --head "$BRANCH" --base "$target" --state open --json number -q '.[0].number' | grep -q .; then
              echo "PR $BRANCH → $target already open"; continue
            fi
            gh pr create --head "$BRANCH" --base "$target" \
              --title "release: merge $BRANCH ($TAG) into $target" \
              --body "Automated after production deployment of $TAG. Requires the normal 2 approvals." \
              || echo "::warning::Could not open PR $BRANCH → $target (maybe nothing to merge)"
          done
