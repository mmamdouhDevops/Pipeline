# CI – stage 1 "CI SAST": every pull request (feature/* → develop, release|hotfix → main, fixes → release/*)
#   plan → policy → SAST (gitleaks, SonarQube, Checkmarx One, Snyk) → SAST gate
#   → unit tests → EF / SQL / OpenAPI checks → "CI / Summary" (required status check, + 2 approvals to merge)
# Nothing is packaged or deployed here – stage 2 "Build" is started manually (build.yml).
name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: write   # SARIF upload (only when vars.UPLOAD_SARIF == 'true')

jobs:
  CI:
    if: github.event.pull_request.draft == false
    uses: mmamdouhDevops/pipeline-templates/.github/workflows/ci-component.yml@v1
    with:
      config: pipeline.yml
      stage: sast
    secrets: inherit
